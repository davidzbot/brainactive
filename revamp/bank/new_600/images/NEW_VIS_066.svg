<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="360" height="300" viewBox="0 0 360 300">
<rect width="360" height="300" fill="#fbfcfe"/>
<text x="180" y="24" font-size="16" fill="#2b2d42" text-anchor="middle" font-family="sans-serif" font-weight="bold">3-by-3 grid: where is the star?</text>
<g font-family="sans-serif" text-anchor="middle">
<rect x="105" y="50" width="50" height="50" fill="#ffffff" stroke="#2b2d42" stroke-width="2"/>
<rect x="155" y="50" width="50" height="50" fill="#ffffff" stroke="#2b2d42" stroke-width="2"/>
<rect x="205" y="50" width="50" height="50" fill="#ffffff" stroke="#2b2d42" stroke-width="2"/>
<rect x="105" y="100" width="50" height="50" fill="#ffffff" stroke="#2b2d42" stroke-width="2"/>
<rect x="155" y="100" width="50" height="50" fill="#ffffff" stroke="#2b2d42" stroke-width="2"/>
<rect x="205" y="100" width="50" height="50" fill="#fff3b0" stroke="#2b2d42" stroke-width="3"/>
<text x="230" y="135" font-size="28" fill="#2b2d42">★</text>
<rect x="105" y="150" width="50" height="50" fill="#ffffff" stroke="#2b2d42" stroke-width="2"/>
<rect x="155" y="150" width="50" height="50" fill="#ffffff" stroke="#2b2d42" stroke-width="2"/>
<rect x="205" y="150" width="50" height="50" fill="#ffffff" stroke="#2b2d42" stroke-width="2"/>
</g>
<text x="105" y="230" font-size="12" fill="#9aa0a6" text-anchor="middle" font-family="sans-serif">rows 1-3 top to bottom</text>
<text x="255" y="230" font-size="12" fill="#9aa0a6" text-anchor="middle" font-family="sans-serif">columns 1-3 left to right</text>
</svg>
