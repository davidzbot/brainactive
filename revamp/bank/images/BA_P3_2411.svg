<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="360" height="300" viewBox="0 0 360 300">
<rect width="360" height="300" fill="#fbfcfe"/>
<text x="180" y="24" font-size="16" fill="#2b2d42" text-anchor="middle" font-family="sans-serif" font-weight="bold">How to read grid squares</text>
<g font-family="sans-serif" text-anchor="middle">
<rect x="105" y="50" width="50" height="50" fill="#ffffff" stroke="#2b2d42" stroke-width="2"/>
<text x="130" y="80" font-size="13" fill="#2b2d42">1,1</text>
<rect x="155" y="50" width="50" height="50" fill="#ffffff" stroke="#2b2d42" stroke-width="2"/>
<text x="180" y="80" font-size="13" fill="#2b2d42">1,2</text>
<rect x="205" y="50" width="50" height="50" fill="#ffffff" stroke="#2b2d42" stroke-width="2"/>
<text x="230" y="80" font-size="13" fill="#2b2d42">1,3</text>
<rect x="105" y="100" width="50" height="50" fill="#ffffff" stroke="#2b2d42" stroke-width="2"/>
<text x="130" y="130" font-size="13" fill="#2b2d42">2,1</text>
<rect x="155" y="100" width="50" height="50" fill="#fff3b0" stroke="#2b2d42" stroke-width="3"/>
<text x="180" y="130" font-size="13" fill="#2b2d42">2,2</text>
<rect x="205" y="100" width="50" height="50" fill="#ffffff" stroke="#2b2d42" stroke-width="2"/>
<text x="230" y="130" font-size="13" fill="#2b2d42">2,3</text>
<rect x="105" y="150" width="50" height="50" fill="#ffffff" stroke="#2b2d42" stroke-width="2"/>
<text x="130" y="180" font-size="13" fill="#2b2d42">3,1</text>
<rect x="155" y="150" width="50" height="50" fill="#ffffff" stroke="#2b2d42" stroke-width="2"/>
<text x="180" y="180" font-size="13" fill="#2b2d42">3,2</text>
<rect x="205" y="150" width="50" height="50" fill="#ffffff" stroke="#2b2d42" stroke-width="2"/>
<text x="230" y="180" font-size="13" fill="#2b2d42">3,3</text>
</g>
<text x="180" y="230" font-size="13" fill="#9aa0a6" text-anchor="middle" font-family="sans-serif">row, column — rows go top to bottom</text>
<text x="180" y="252" font-size="13" fill="#9aa0a6" text-anchor="middle" font-family="sans-serif">columns go left to right (centre = 2,2)</text>
</svg>
