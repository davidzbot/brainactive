<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="360" height="262" viewBox="0 0 360 262">
<rect width="360" height="262" fill="#fbfcfe"/>
<text x="180" y="24" font-size="16" fill="#2b2d42" text-anchor="middle" font-family="sans-serif" font-weight="bold">Fold twice, punch outer corner</text>
<rect x="30" y="60" width="120" height="120" fill="#ffffff" stroke="#2b2d42" stroke-width="3"/>
<line x1="30" y1="120" x2="150" y2="120" stroke="#e63946" stroke-width="2" stroke-dasharray="7,5"/>
<line x1="90" y1="60" x2="90" y2="180" stroke="#e63946" stroke-width="2" stroke-dasharray="7,5"/>
<text x="90" y="205" font-size="12" fill="#9aa0a6" text-anchor="middle" font-family="sans-serif" font-weight="bold">fold 1: top-down, fold 2: left-right</text>
<rect x="230" y="110" width="70" height="70" fill="#e8f4fd" stroke="#2b2d42" stroke-width="3"/>
<text x="292" y="126" font-size="20" fill="#e63946" text-anchor="middle" font-family="sans-serif" font-weight="bold">×</text>
<text x="265" y="205" font-size="12" fill="#9aa0a6" text-anchor="middle" font-family="sans-serif" font-weight="bold">packet = quarter (4 layers)</text>
</svg>
