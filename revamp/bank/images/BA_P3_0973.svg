<circle cx="70" cy="190" r="30" fill="#4a90d9" stroke="#2b2d42" stroke-width="3"/>
<text x="105" y="230" font-size="18" fill="#2b2d42" text-anchor="middle" font-family="sans-serif" font-weight="bold">-&gt;</text>
