<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="360" height="262" viewBox="0 0 360 262">
<rect width="360" height="262" fill="#fbfcfe"/>
<text x="180" y="24" font-size="16" fill="#2b2d42" text-anchor="middle" font-family="sans-serif" font-weight="bold">Fold left edge right, punch top-right</text>
<rect x="40" y="60" width="100" height="100" fill="#ffffff" stroke="#2b2d42" stroke-width="3"/>
<line x1="90" y1="60" x2="90" y2="160" stroke="#e63946" stroke-width="2" stroke-dasharray="7,5"/>
<polygon points="108,110 96,104 96,116" fill="#e63946"/>
<text x="90" y="190" font-size="12" fill="#9aa0a6" text-anchor="middle" font-family="sans-serif" font-weight="bold">fold here</text>
<rect x="220" y="60" width="50" height="100" fill="#e8f4fd" stroke="#2b2d42" stroke-width="3"/>
<text x="258" y="72" font-size="20" fill="#e63946" text-anchor="middle" font-family="sans-serif" font-weight="bold">×</text>
<text x="245" y="190" font-size="12" fill="#9aa0a6" text-anchor="middle" font-family="sans-serif" font-weight="bold">folded packet (2 layers)</text>
</svg>
