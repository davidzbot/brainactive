<text x="180" y="24" font-size="16" fill="#2b2d42" text-anchor="middle" font-family="sans-serif" font-weight="bold">Square turns 90 deg clockwise</text>
<rect x="30" y="80" width="60" height="60" fill="#ffffff" stroke="#2b2d42" stroke-width="3"/>
<circle cx="84" cy="86" r="7" fill="#e63946"/>
