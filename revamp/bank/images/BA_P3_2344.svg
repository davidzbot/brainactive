<rect x="150" y="80" width="60" height="60" fill="#ffffff" stroke="#2b2d42" stroke-width="3"/>
<circle cx="204" cy="134" r="7" fill="#e63946"/>
<text x="180" y="170" font-size="12" fill="#9aa0a6" text-anchor="middle" font-family="sans-serif" font-weight="bold">1 turn</text>
