<text x="158" y="170" font-size="12" fill="#9aa0a6" text-anchor="middle" font-family="sans-serif" font-weight="bold">step 2: right</text>
<polygon points="262,144 252,107 272,107" fill="#2b2d42"/>
<text x="262" y="170" font-size="12" fill="#9aa0a6" text-anchor="middle" font-family="sans-serif" font-weight="bold">step 3: down</text>
